
<!DOCTYPE html>

<head>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>♾️</text></svg>">
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style type="text/tailwindcss">
    :root {
      --electric-blue: #00FFFF;
      --near-black: #0D0D0D;
      --light-gray: #A0A0A0;
      --gemini-title-color: #E0E0E0;
      --soft-electric-blue: #70D7FF;
      --card-bg: #1A1A1A;
      --border-color: #2D2D2D;
    }
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--near-black);
      color: var(--gemini-title-color);
      min-height: 100vh;
      min-height: 100dvh;
    }
    .safe-area-bottom {
      padding-bottom: env(safe-area-inset-bottom);
    }
    .bg-near-black-80-backdrop {
      background-color: rgba(13, 13, 13, 0.8); /* near-black with 80% opacity */
      backdrop-filter: blur(10px);
    }
    .fab-icon-enter {
      opacity: 0;
      transform: translateY(10px) scale(0.8);
    }
    .fab-icon-enter-active {
      opacity: 1;
      transform: translateY(0) scale(1);
      transition-property: opacity, transform;
      transition-timing-function: ease-out;
      transition-duration: 300ms;
    }
    .plus-icon-rotate {
      transition: transform 0.3s ease-out;
    }
    .plus-icon-rotate.expanded {
      transform: rotate(45deg);
    }
  </style>
